{{- /*
DEMO 10 (lookup): reuse the existing session key if the Secret is already in the cluster.
`helm template` and ArgoCD have no cluster access, so lookup returns nothing and...
FLAW HELM-TPL-002: randAlphaNum generates a NEW key on every render. ArgoCD sees a diff on every
sync and users get logged out. Fix: create the key once outside the chart (External Secrets), or
pass it in values.
*/ -}}
{{- $name := printf "%s-auth" (include "orderflow.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  session-key: {{ index $existing.data "session-key" }}
  {{- else }}
  session-key: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
  {{- /* FLAW CKS-SEC-002 / LRN-SEC-005: comes from a value committed in values.yaml. */}}
  jwt-secret: {{ .Values.auth.jwtSecret | b64enc }}
