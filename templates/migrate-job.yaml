# DEMO 12 (hooks): a pre-install/pre-upgrade Job runs before the release's other resources.
# Talking point (not a rule): on FIRST install the ConfigMap and the database don't exist yet,
# because hooks run before them. The Job waits on a missing ConfigMap and the install times out.
# Fix: make it a post-install hook, or give the ConfigMap its own earlier hook weight.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "orderflow.fullname" . }}-migrate
  labels:
    {{- include "labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "orderflow.image" (dict "root" . "image" .Values.api.image) | quote }}
          args: ["migrate", "up"]
          envFrom:
            - configMapRef:
                name: {{ include "orderflow.fullname" . }}-config
