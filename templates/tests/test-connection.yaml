# `helm test <release>` runs this pod (hook: test). It isn't part of a normal install.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "orderflow.fullname" . }}-test
  labels:
    {{- include "labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget", "-qO-", "http://{{ include "orderflow.fullname" . }}-frontend:80/"]
      securityContext:
        {{- include "orderflow.securityContext" . | nindent 8 }}
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 16Mi }
